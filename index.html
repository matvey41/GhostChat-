<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3390ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GhostChat">
<link rel="manifest" href="manifest.json">
<title>GhostChat</title>
<style>
:root{--blue:#3390ec;--bg:#fff;--panel:#f4f4f5;--text:#111;--muted:#8a8a8e;--line:#e7e7e9;--mine:#d9fdd3}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}
button,input{font:inherit}button{cursor:pointer;border:0}
.app{height:100dvh;max-width:680px;margin:auto;display:flex;flex-direction:column;background:white}
.top{background:var(--blue);color:white;padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-size:22px;font-weight:800}
.brand{font-size:20px;font-weight:750;letter-spacing:.1px}.subtitle{font-size:12px;opacity:.88;margin-top:2px}
.search-wrap{padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}
.search{width:100%;border:0;border-radius:12px;background:#f1f1f3;padding:12px 14px;outline:none}
.content{flex:1;min-height:0;overflow:auto}.section-title{font-size:13px;font-weight:700;color:var(--muted);padding:14px 16px 7px;text-transform:uppercase;letter-spacing:.5px}
.chat-row{display:flex;gap:12px;padding:12px 16px;align-items:center;width:100%;text-align:left;background:white;border-bottom:1px solid #f2f2f4}
.chat-row:active{background:#f5f8fb}.avatar{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:700;font-size:18px;background:#67b3e8}
.chat-info{min-width:0;flex:1}.name-line{display:flex;justify-content:space-between;gap:8px;align-items:center}.name{font-size:16px;font-weight:650}.time{font-size:12px;color:var(--muted);white-space:nowrap}.preview{font-size:14px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom{display:flex;border-top:1px solid var(--line);padding:8px 0 calc(env(safe-area-inset-bottom) + 7px);background:#fff}.tab{flex:1;background:white;color:var(--muted);display:grid;gap:4px;place-items:center;font-size:11px}.tab .ico{font-size:22px}.tab.active{color:var(--blue)}
.chat-view{display:none;flex-direction:column;flex:1;min-height:0;background:#eaf0f5;background-image:radial-gradient(#dbe5ec 1px,transparent 1px);background-size:18px 18px}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--blue);color:white;padding-top:calc(env(safe-area-inset-top) + 10px)}
.back{background:transparent;color:white;font-size:26px;padding:0 5px}.head-avatar{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-weight:700}.head-text{flex:1}.head-name{font-weight:700}.head-status{font-size:12px;opacity:.85;margin-top:2px}
.messages{flex:1;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:82%;padding:9px 11px;border-radius:14px;background:white;box-shadow:0 1px 1px #0000000a;font-size:15px;line-height:1.35;overflow-wrap:anywhere;align-self:flex-start}.bubble.mine{align-self:flex-end;background:var(--mine);border-bottom-right-radius:5px}.bubble .stamp{font-size:10px;color:#78908b;text-align:right;margin-top:4px}
.composer{display:flex;gap:8px;padding:9px 10px calc(env(safe-area-inset-bottom) + 9px);background:#f7f7f7;align-items:center}.composer input{min-width:0;flex:1;border:0;background:white;border-radius:22px;padding:12px 15px;outline:none}.send{width:44px;height:44px;border-radius:50%;background:var(--blue);color:white;font-size:19px}
.empty{padding:35px 22px;text-align:center;color:var(--muted);line-height:1.5}.new-chat{position:fixed;right:max(20px,calc((100vw - 640px)/2));bottom:82px;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;font-size:27px;box-shadow:0 4px 14px #0002}
.notice{font-size:12px;color:var(--muted);padding:10px 16px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="mainTop"><div class="logo">G</div><div><div class="brand">GhostChat</div><div class="subtitle">Сообщения рядом с тобой</div></div></header>
  <div class="search-wrap" id="searchWrap"><input id="search" class="search" placeholder="Поиск" autocomplete="off"></div>
  <main class="content" id="listView">
    <div class="section-title">Все чаты</div>
    <div id="chatList"></div>
    <div class="notice">Это первая демоверсия. Сообщения пока хранятся только на этом устройстве.</div>
  </main>
  <section class="chat-view" id="chatView">
    <header class="chat-head"><button class="back" id="back" aria-label="Назад">‹</button><div class="head-avatar" id="headAvatar">G</div><div class="head-text"><div class="head-name" id="headName">GhostChat</div><div class="head-status">личный чат</div></div><div>⋮</div></header>
    <div class="messages" id="messages"></div>
    <form class="composer" id="composer"><input id="messageInput" placeholder="Сообщение..." autocomplete="off"><button class="send" aria-label="Отправить">➤</button></form>
  </section>
  <nav class="bottom" id="bottomNav">
    <button class="tab active"><span class="ico">▣</span>Чаты</button><button class="tab" id="contactsTab"><span class="ico">♙</span>Контакты</button><button class="tab" id="settingsTab"><span class="ico">⚙</span>Настройки</button>
  </nav>
  <button class="new-chat" id="newChat" aria-label="Новый чат">＋</button>
</div>
<script>
const starterChats = [
 {id:"welcome",name:"GhostChat",avatar:"G",color:"#3390ec",preview:"Добро пожаловать! 👋",time:"сейчас",messages:[{text:"Привет! 👋 Это первая версия GhostChat.",mine:false,time:"сейчас"},{text:"Пока это демонстрация: сообщения сохраняются только в этом браузере. Следующим шагом подключим настоящие аккаунты и переписку между устройствами.",mine:false,time:"сейчас"}]},
 {id:"ideas",name:"Идеи для GhostChat",avatar:"💡",color:"#e8a23a",preview:"Какие функции добавим?",time:"вчера",messages:[{text:"Какие функции хочешь добавить в GhostChat?",mine:false,time:"вчера"}]},
 {id:"notes",name:"Избранное",avatar:"★",color:"#8b7bd8",preview:"Личные заметки",time:"пн",messages:[{text:"Сюда можно записывать идеи для будущих версий.",mine:false,time:"пн"}]}
];
let chats;
try{chats=JSON.parse(localStorage.getItem("ghostchat_chats"))||starterChats}catch(e){chats=starterChats}
let activeId=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("ghostchat_chats",JSON.stringify(chats))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderList(filter=""){
 const root=$("chatList");root.innerHTML="";
 const filtered=chats.filter(c=>c.name.toLowerCase().includes(filter.toLowerCase()));
 if(!filtered.length){root.innerHTML='<div class="empty">Ничего не найдено.<br>Попробуй другое название.</div>';return}
 filtered.forEach(c=>{
  const row=document.createElement("button");row.className="chat-row";row.innerHTML=`<div class="avatar" style="background:${c.color}">${esc(c.avatar)}</div><div class="chat-info"><div class="name-line"><span class="name">${esc(c.name)}</span><span class="time">${esc(c.time||"")}</span></div><div class="preview">${esc(c.preview||"Нет сообщений")}</div></div>`;
  row.onclick=()=>openChat(c.id);root.appendChild(row)
 })
}
function openChat(id){activeId=id;const c=chats.find(x=>x.id===id);$("listView").style.display="none";$("searchWrap").style.display="none";$("mainTop").style.display="none";$("bottomNav").style.display="none";$("newChat").style.display="none";$("chatView").style.display="flex";$("headName").textContent=c.name;$("headAvatar").textContent=c.avatar;$("headAvatar").style.background=c.color;renderMessages();$("messageInput").focus()}
function renderMessages(){const c=chats.find(x=>x.id===activeId);const root=$("messages");root.innerHTML="";c.messages.forEach(m=>{const el=document.createElement("div");el.className="bubble"+(m.mine?" mine":"");el.innerHTML=`${esc(m.text)}<div class="stamp">${esc(m.time||"сейчас")}${m.mine?" ✓✓":""}</div>`;root.appendChild(el)});root.scrollTop=root.scrollHeight}
function back(){activeId=null;$("chatView").style.display="none";$("listView").style.display="block";$("searchWrap").style.display="block";$("mainTop").style.display="flex";$("bottomNav").style.display="flex";$("newChat").style.display="grid";renderList($("search").value)}
$("back").onclick=back;
$("composer").addEventListener("submit",e=>{e.preventDefault();const input=$("messageInput"),text=input.value.trim();if(!text)return;const c=chats.find(x=>x.id===activeId);c.messages.push({text,mine:true,time:new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})});c.preview=text;c.time="сейчас";input.value="";save();renderMessages()});
$("search").addEventListener("input",e=>renderList(e.target.value));
$("newChat").onclick=()=>{const name=prompt("Название нового чата:");if(!name||!name.trim())return;const clean=name.trim();const id="chat_"+Date.now();chats.unshift({id,name:clean,avatar:clean[0].toUpperCase(),color:["#3390ec","#e8a23a","#8b7bd8","#36a88a","#df6a80"][chats.length%5],preview:"Новый чат",time:"сейчас",messages:[{text:"Чат создан! Напиши первое сообщение ✨",mine:false,time:"сейчас"}]});save();renderList();openChat(id)};
$("contactsTab").onclick=()=>alert("Контакты появятся, когда подключим аккаунты и сервер 🙂");
$("settingsTab").onclick=()=>alert("Настройки профиля добавим на следующем этапе.");
renderList();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
</body></html>
